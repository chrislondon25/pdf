<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Webpage</title>
    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* Header */
      header {
        width: 100%;
        background-color: black;
        color: white;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      header a {
        color: #16b408;
        text-decoration: none;
      }

      header span {
        color: #fff;
        font-size: 1.125rem;
      }

      header mark {
        background-color: rgba(0, 0, 0, 0);
        color: #16b408;
        font-size: 1.875rem;
        line-height: 0.625rem;
      }

      .inn_head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        width: 100%;
        max-width: 75rem;
      }

      .logo {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        gap: 10px;
        /* font-weight: bold; */
      }

      .settings {
        font-size: 16px;
        cursor: pointer;
      }

      /* Main Section */
      .hero {
        text-align: center;
        /* padding: 60px 20px; */

        margin-top: 50px;
        margin-left: 1.25rem;
        border: 1px solid #c8c8c8;
        border-left: 0;
        border-right: 0;
        height: 12.0625rem;
        position: relative;
        /* padding: 0; */
      }

      .hero img {
        max-width: 200px;
        height: auto;
        margin-top: 20px;
        margin-bottom: 10px;
      }

      .hero h1 {
        margin: 10px 0;
        font-size: 32px;

        margin-top: 0.3125rem;
        font-size: 1.625rem;
        color: #16b408;
        font-weight: 900;
        margin-bottom: 0;
        line-height: 1.75rem;
      }

      .hero p {
        color: #555;
        font-size: 18px;
        max-width: 600px;
        margin: 0 auto;

        margin-top: 0.625rem;
        padding: 0;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="inn_head">
        <a href="https://app.safarioffice.com">
          <div class="logo">
            <img
              src="https://www.safarioffice.com/wp/wp-content/themes/safarioffice/images/logo.svg"
              alt="SafariOffice"
            />
            <span class="logo-text"
              >Safari<strong>Office</strong><mark>.</mark></span
            >
          </div>
        </a>
        <!-- <div class="settings">Settings</div> -->
      </div>
    </header>

    <section class="hero">
      <img
        src="https://app.safarioffice.com/icon/32/green/requests.svg"
        alt="Sample Image"
      />
      <h1>Request Canceled.</h1>
      <p>
        There are currently no New Request in your Inbox.
        <br />
        You can start a new one by '<a
          style="color: #16b408; text-decoration: none"
          href="https://app.safarioffice.com/requests#add"
          >adding a new request</a
        >'.
      </p>
    </section>
  </body>
</html>
